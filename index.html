<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dépôt XBET</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="carte">
    <h1>Dépôt XBET</h1>
    <p class="sous-titre">Convertis tes Kwanza en FCFA</p>

    <label for="kwanza">Montant en Kwanza (AOA)</label>
    <input type="number" id="kwanza" placeholder="Ex : 220000" min="0">

    <div class="resultat">
      <span>Tu reçois</span>
      <strong id="fcfa">0 FCFA</strong>
    </div>

    <label for="idxbet">Ton ID XBET</label>
    <input type="text" id="idxbet" placeholder="Ex : 123456789">

    <button id="bouton">Demander le dépôt sur WhatsApp</button>
    <p id="erreur" class="erreur"></p>
  </div>

  <script src="app.js"></script>
</body>
</html>
